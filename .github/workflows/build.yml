name: Build

# Builds the mod on GitHub's servers every time you push.
# The finished files appear under Actions -> (latest run) -> Artifacts -> "hollow-shift".

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25 (build tools need it; the mod itself targets Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      # Turns the build's error messages into annotations, so they show on the run's summary page
      # (and can be read through GitHub's API without downloading the full log).
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          log = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          def esc(s):
              return s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          # Compiler errors: file.java:123: error: message (+ the following detail lines)
          errs = []
          for i, line in enumerate(log):
              m = re.search(r"(src/[^\s:]+\.java):(\d+): error: (.*)", line)
              if m:
                  detail = [l.strip() for l in log[i + 1:i + 4] if re.match(r"\s+(symbol|location|required|found|reason)", l)]
                  errs.append(f"{m.group(1)}:{m.group(2)}: {m.group(3)} {' | '.join(detail)}")
          for chunk in range(0, min(len(errs), 160), 40):
              print("::error title=Compile errors " + str(chunk + 1) + "::" + esc("\n".join(errs[chunk:chunk + 40])))
          # Gradle's own explanation
          text = "\n".join(log)
          for m in re.finditer(r"\* What went wrong:\n(.*?)(?:\n\* Try:|\Z)", text, re.S):
              print("::error title=What went wrong::" + esc(m.group(1).strip()[:6000]))
          # Last lines, in case neither pattern matched
          print("::error title=Log tail::" + esc("\n".join(log[-60:])[:6000]))
          PY

      - name: Check the Director's pacing rules
        run: ./gradlew simulate

      - name: Upload mod and shader pack
        uses: actions/upload-artifact@v4
        with:
          name: hollow-shift
          path: |
            build/libs/hollow-shift-*.jar
            !build/libs/*-sources.jar
            build/libs/HollowShift-Shaders.zip

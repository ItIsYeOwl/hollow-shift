name: Build

# Builds the mod on GitHub's servers every time you push.
# The finished files appear under Actions -> (latest run) -> Artifacts -> "hollow-shift".

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Check the Director's pacing rules
        run: ./gradlew simulate

      - name: Upload mod and shader pack
        uses: actions/upload-artifact@v4
        with:
          name: hollow-shift
          path: |
            build/libs/hollow-shift-*.jar
            !build/libs/*-sources.jar
            build/libs/HollowShift-Shaders.zip
